<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Search, book, and manage intercity bus travel across Nigeria with TashaXpress." />
    <meta name="theme-color" content="#FF6B4A" />

    <!-- Fonts are pulled from Google Fonts in index.css — preconnect here so
         the connection warms up before the CSS is even parsed, shaving real
         time off first paint of text. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn, etc.) -->
    <meta property="og:title" content="TashaXpress" />
    <meta property="og:description" content="Search, book, and manage intercity bus travel across Nigeria." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TashaXpress" />
    <meta name="twitter:description" content="Search, book, and manage intercity bus travel across Nigeria." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Booking flows show phone numbers as plain data (e.g. passenger
         contact info) — this stops iOS Safari from auto-styling every
         digit string on the page as a tappable phone link. -->
    <meta name="format-detection" content="telephone=no" />

    <title>TashaXpress — Book your route</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
